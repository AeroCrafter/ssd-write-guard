# Public, read-only deployment for www.codextest.com.
# Copy the server block into the site's Nginx configuration and adjust root.

server {
    listen 80;
    listen [::]:80;
    server_name codextest.com www.codextest.com;

    root /www/wwwroot/codextest.com/public;
    index index.html;

    # Keep HTTP available for ACME validation; enable the HTTPS server block
    # generated by Baota after the certificate is issued.
    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The public host must never serve project source or local reports.
    location ~ ^/(?:server\.mjs|report\.mjs|src(?:/|$)|test(?:/|$)|\.git(?:/|$)|(?:package|package-lock)\.json|(?:README|SECURITY)\.md) {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known)(?:[^/]+) {
        deny all;
        return 404;
    }

    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
}

# Baota should create the TLS server block. These headers are safe only after
# HTTPS is active; add them to that block as well.
# add_header Strict-Transport-Security "max-age=31536000" always;

